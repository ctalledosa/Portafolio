<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinthia Libertad Talledo Saavedra | Portafolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fafaf9;
      --surface-color: #ffffff;
      --text-primary: #18181b;
      --text-secondary: #52525b;
      --accent: #e11d48;          /* Coral / Terracota vibrante para KPIs y botones */
      --accent-soft: #ffe4e6;     /* Fondo suave para etiquetas de categoría */
      --accent-hover: #be123c;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --border: #e4e4e7;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
    }

    /* Header / Hero Section - Fondo más oscuro y elegante */
    header {
      background: linear-gradient(135deg, #0f0c1b 0%, #1c0928 100%);
      color: #ffffff;
      padding: 0 0 7rem 0;
      text-align: center;
      overflow: hidden;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Cinta animada de ancho completo (Full-width Marquee) */
    .ticker-full-wrap {
      width: 100%;
      background-color: rgba(251, 113, 133, 0.15);
      border-top: 1px solid rgba(253, 164, 175, 0.35);
      border-bottom: 1px solid rgba(253, 164, 175, 0.35);
      padding: 0.65rem 0;
      margin-bottom: 3.5rem;
      overflow: hidden;
      display: flex;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: ticker-scroll 28s linear infinite;
    }

    .ticker-full-wrap:hover .ticker-track {
      animation-play-state: paused;
    }

    .ticker-item {
      white-space: nowrap;
      font-size: 0.9rem;
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.02em;
      color: #fda4af;
      padding-right: 2rem;
    }

    @keyframes ticker-scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    header p.subtitle {
      max-width: 720px;
      margin: 0 auto 2.5rem;
      font-size: 1.1rem;
      color: #cbd5e1;
      font-weight: 300;
    }

    .hero-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Botones uniformes con fondo oscuro y hover rojo */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Main Content & KPI Bar */
    main {
      padding: 3rem 1.5rem 5rem;
    }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-top: -6rem;
      margin-bottom: 3.5rem;
      position: relative;
      z-index: 10;
    }

    .kpi-card {
      background-color: var(--surface-color);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }

    .kpi-number {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--accent);
      display: block;
      margin-bottom: 0.25rem;
    }

    .kpi-label {
      font-size: 0.88rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Section Headings */
    .section-header {
      margin-bottom: 2rem;
    }

    .section-header h2 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .section-header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Case Study Cards */
    .cases-grid {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .case-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.25s ease;
    }

    .case-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .case-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .case-category {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background-color: var(--accent-soft);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
    }

    .impact-pill {
      background-color: var(--success-bg);
      color: var(--success-text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
    }

    .case-card h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .case-summary {
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
      font-size: 0.98rem;
    }

    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tech-tag {
      background-color: #f1f5f9;
      color: #334155;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    /* Expandable Case Details */
    details {
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }

    summary {
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "↓";
      transition: transform 0.2s ease;
    }

    details[open] summary::after {
      transform: rotate(180deg);
    }

    .case-details-body {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .detail-block h4 {
      color: var(--text-primary);
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }

    .detail-block ul {
      padding-left: 1.25rem;
    }

    .detail-block li {
      margin-bottom: 0.35rem;
    }

    .evidence-link {
      display: inline-block;
      margin-top: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .evidence-link:hover {
      text-decoration: underline;
    }

    /* Widget flotante de WhatsApp con Menú Interactivo */
    .whatsapp-widget {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      font-family: 'Inter', sans-serif;
    }

    .whatsapp-menu {
      display: none;
      flex-direction: column;
      width: 295px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.2), 0 8px 15px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid #e4e4e7;
      overflow: hidden;
      animation: slideUp 0.22s ease-out;
    }

    .whatsapp-menu.active {
      display: flex;
    }

    .wa-menu-header {
      background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
      color: #ffffff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wa-menu-header strong {
      display: block;
      font-size: 0.95rem;
    }

    .wa-menu-header span {
      font-size: 0.78rem;
      opacity: 0.9;
    }

    .wa-close-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.85;
    }

    .wa-close-btn:hover {
      opacity: 1;
    }

    .wa-menu-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #fafaf9;
    }

    .wa-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background-color: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 10px;
      text-decoration: none;
      color: #18181b;
      font-size: 0.86rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .wa-option:hover {
      border-color: #25d366;
      background-color: #f0fdf4;
      transform: translateX(-2px);
    }

    .wa-option-icon {
      font-size: 1.2rem;
    }

    .wa-option-text small {
      display: block;
      font-weight: 400;
      font-size: 0.75rem;
      color: #52525b;
    }

    .whatsapp-trigger-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .whatsapp-popup {
      background-color: #ffffff;
      color: #18181b;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      font-size: 0.88rem;
      font-weight: 6
